<style>
:root{--blue:#1769e6;--blue2:#0a52c4;--sky:#22b8ff;--navy:#0b1b3f;--muted:#6a7d9e;--line:rgba(23,105,230,.12);--glass:rgba(255,255,255,.78);--ok:#22c55e;--danger:#e5484d;--shadow:0 10px 30px rgba(24,98,210,.14);--nav:66px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--navy);background:radial-gradient(900px 500px at 15% -10%,#c6e0ff,transparent),linear-gradient(160deg,#cde2f8,#e6f2ff 55%,#c7ddf5);overflow:hidden;font-size:15px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{position:fixed;inset:0;margin:auto;max-width:520px;overflow:hidden;background:linear-gradient(180deg,#dbebfd 0%,#eaf4ff 38%,#e2effd 100%)}
@media(min-width:560px){#app{top:14px;bottom:14px;border-radius:34px;box-shadow:0 30px 80px rgba(20,80,180,.28);border:1px solid rgba(255,255,255,.85)}}
#screen{position:absolute;inset:0;display:flex;flex-direction:column}
.ic{width:22px;height:22px;flex:none}
.hidden{display:none!important}
.grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
b{font-weight:700}
/* header / nav */
header.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.brand{display:flex;align-items:center;gap:9px}
.brand .ico{width:34px;height:34px;border-radius:10px;box-shadow:0 4px 12px rgba(23,105,230,.3)}
.brand .word{height:20px;width:auto}
.top-actions{display:flex;gap:4px}
.ib{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--navy);flex:none}
.ib:active{background:rgba(23,105,230,.1)}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--nav) + 20px);scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
nav.nav{position:absolute;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:var(--nav);display:flex;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.95);border-radius:26px;box-shadow:var(--shadow);z-index:5}
nav.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#5b6f93;font-size:10.5px;font-weight:600;position:relative}
nav.nav button.on{color:var(--blue)}
nav.nav button.on .ic{stroke-width:2.4}
nav.nav .nb{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--blue);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.pagehead{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 8px}
.pagehead h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px}
/* inputs, buttons */
.searchbar{margin:6px 16px 10px;display:flex;align-items:center;gap:10px;padding:0 14px;height:46px;background:var(--glass);border:1px solid rgba(255,255,255,.95);border-radius:16px;box-shadow:0 4px 14px rgba(24,98,210,.07);color:var(--muted)}
.searchbar input{flex:1;border:0;outline:0;background:none;color:var(--navy);min-width:0}
.chips{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.chip{padding:8px 18px;border-radius:14px;background:var(--glass);font-weight:600;font-size:13.5px;color:#4a5f86;border:1px solid rgba(255,255,255,.95);white-space:nowrap}
.chip.on{background:linear-gradient(180deg,#2a7cf0,#1262e0);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(23,105,230,.35)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:16px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(180deg,#2d83f5,#0f5ad8);box-shadow:0 8px 20px rgba(23,105,230,.35),inset 0 1px 0 rgba(255,255,255,.35);width:100%}
.btn:active{transform:scale(.98)}
.btn.soft{background:rgba(23,105,230,.12);color:var(--blue);box-shadow:none}
.btn.white{background:#fff;color:var(--navy);box-shadow:0 4px 14px rgba(24,98,210,.12)}
.btn.danger{background:rgba(229,72,77,.12);color:var(--danger);box-shadow:none}
.btn.sm{height:40px;font-size:14px;border-radius:13px;width:auto;padding:0 18px}
.btn[disabled],.sbtn[disabled]{opacity:.6;pointer-events:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.5);border-top-color:#fff;animation:sp .7s linear infinite}
.btn.soft .spin,.btn.white .spin{border-color:rgba(23,105,230,.25);border-top-color:var(--blue)}
@keyframes sp{to{transform:rotate(360deg)}}
.field{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;margin-bottom:12px;background:rgba(255,255,255,.85);border:1.5px solid rgba(255,255,255,.95);border-radius:16px;box-shadow:0 4px 14px rgba(24,98,210,.08);color:#5b6f93}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,105,230,.12)}
.field input,.field textarea{flex:1;border:0;outline:0;background:none;min-width:0;color:var(--navy);resize:none}
.field.area{height:auto;padding:12px 14px;align-items:flex-start}
.hint{font-size:12.5px;margin:-6px 6px 10px;min-height:16px;color:var(--muted)}
.hint.ok{color:#16a34a}.hint.bad{color:var(--danger)}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);margin:2px 4px 6px;display:block}
/* avatar */
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none;background:#c9d8ee}
.av svg{width:55%;height:55%}
/* list rows */
.list{padding:0 8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:18px;cursor:pointer}
.row:active{background:rgba(255,255,255,.7)}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.r1 time{font-size:12px;color:var(--muted);flex:none}
.r2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.r2 .prev{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px;flex:none}
.sechead{padding:12px 18px 4px;font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.empty{text-align:center;color:var(--muted);padding:50px 30px}
.empty .big{font-size:42px;margin-bottom:6px}
.fab{position:absolute;right:20px;bottom:calc(var(--nav) + 26px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,#2d83f5,#0f5ad8);box-shadow:0 10px 24px rgba(23,105,230,.45);z-index:4}
.fab .ic{width:28px;height:28px;stroke-width:2.6}
.sbtn{padding:8px 18px;border-radius:12px;background:rgba(23,105,230,.12);color:var(--blue);font-weight:700;font-size:13.5px;flex:none}
.sbtn.on{background:linear-gradient(180deg,#2d83f5,#0f5ad8);color:#fff;box-shadow:0 5px 12px rgba(23,105,230,.3)}
.seg{display:flex;gap:10px;padding:0 16px 8px}
.seg button{flex:1;height:44px;border-radius:15px;background:var(--glass);font-weight:700;color:#4a5f86;border:1px solid rgba(255,255,255,.95)}
.seg button.on{background:linear-gradient(180deg,#2d83f5,#0f5ad8);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(23,105,230,.35)}
/* auth */
.auth{flex:1;overflow-y:auto;padding:calc(34px + env(safe-area-inset-top)) 26px 120px;position:relative;z-index:1}
.auth .logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
.auth .logo img.i{width:58px;height:58px;border-radius:17px;box-shadow:0 8px 22px rgba(23,105,230,.35)}
.auth .logo img.w{height:32px}
.auth .tag{text-align:center;margin:12px 0 28px;font-weight:600;color:#33486f}
.auth h2{text-align:center;margin:20px 0 22px;font-size:26px;font-weight:800}
.auth .row2{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 18px;font-size:14px}
.chk{display:flex;align-items:center;gap:9px;color:#33486f;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
.link{color:var(--blue);font-weight:700}
.auth .center{text-align:center;margin-top:16px;font-size:14.5px}

.spk::before{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid #2d83f5;opacity:0;pointer-events:none}
.spk.blink::before{animation:spkr 1.1s ease-out infinite}
.spk.blink .ic{animation:spkb .5s ease-in-out infinite alternate}
@keyframes spkr{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes spkb{from{opacity:1;transform:scale(1)}to{opacity:.45;transform:scale(1.2)}}
.spk .dot{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:9px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;padding:0 3px;font-style:normal;line-height:1}
.zap{width:30px;height:30px;overflow:visible;display:block}
.zap .z-on{display:none;filter:drop-shadow(0 0 3px rgba(45,131,245,.85))}
.zap.on .z-off,.like.liked .z-off{display:none}.zap.on .z-on,.like.liked .z-on{display:block}
.z-on .orb{transform-origin:24px 24px;animation:zorb 2.4s linear infinite}
@keyframes zorb{to{transform:rotate(360deg)}}
.like.popz .zap{animation:zpop .5s ease}@keyframes zpop{40%{transform:scale(1.4)}}
.story .sb .like{width:48px;height:48px}.story .sb .like .zap{width:44px;height:44px}
.vz .zap{width:30px;height:30px}
.nlist{flex:1;overflow-y:auto;padding:8px 12px calc(20px + env(safe-area-inset-bottom))}
.nrow{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:16px;margin-bottom:4px;cursor:pointer}
.nrow.new{background:rgba(23,105,230,.09)}
.nrow .nav{position:relative;flex:none;width:46px;height:46px}
.nrow .nb2{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.nrow .nemo{width:46px;height:46px;border-radius:50%;background:rgba(23,105,230,.12);display:grid;place-items:center;font-size:24px}
.nrow .nt{font-size:14.5px;line-height:1.3;white-space:normal}
.lbtabs{display:flex;gap:6px;padding:4px;border-radius:16px;background:rgba(23,105,230,.1);margin-bottom:10px}
.lbtabs button{flex:1;height:38px;border-radius:12px;font-weight:800;color:#4a5f86}
.lbtabs button.on{background:#fff;color:var(--blue);box-shadow:0 3px 10px rgba(23,105,230,.18)}
.lbnote{padding:14px 6px;font-size:13px;color:var(--muted);text-align:center;white-space:normal}.lbnote a{color:var(--blue);font-weight:700}
.lsep{height:1px;background:var(--line);margin:8px 0}
.pbanner{margin:0 16px 12px;width:calc(100% - 32px);padding:14px 16px;border-radius:20px;display:flex;align-items:center;gap:12px;text-align:left;background:linear-gradient(135deg,#16224a,#223b86);color:#fff;box-shadow:0 10px 24px rgba(20,40,110,.35);border:1px solid rgba(255,212,90,.5)}
.pbanner .cr{font-size:26px}.pbanner small{display:block;color:#ffd45a;font-weight:600;font-size:12.5px}
.ov.full.prem{background:linear-gradient(180deg,#0a1230,#10204d 55%,#0a1230);color:#fff}
.pm-top{padding:calc(8px + env(safe-area-inset-top)) 8px 0}.pm-top .ib{color:#fff}
.pm-scroll{flex:1;overflow-y:auto;padding:0 18px calc(28px + env(safe-area-inset-bottom));scrollbar-width:none}
.pm-hero{text-align:center;padding:4px 0 18px}
.pm-hero .crown{width:92px;height:92px;filter:drop-shadow(0 6px 18px rgba(255,190,40,.55));animation:pmf 3s ease-in-out infinite}
@keyframes pmf{50%{transform:translateY(-5px)}}
.pm-hero h1{margin:6px 0 6px;font-size:25px;line-height:1.2;font-weight:800}.pm-hero h1 span{background:linear-gradient(90deg,#ffe27a,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent}
.pm-hero p{margin:0 auto 12px;color:#b8c6e8;font-size:14px;max-width:290px}
.pm-soon{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(255,212,90,.15);border:1px solid rgba(255,212,90,.55);color:#ffd45a;font-weight:800;font-size:12.5px}
.pm-card{position:relative;margin:0 0 16px;padding:18px 16px 16px;border-radius:22px;background:#142252;border:1px solid rgba(255,255,255,.12)}
.pm-card.pro{background:linear-gradient(180deg,#1b2c68,#142252);border:1.5px solid #ffc83d;animation:pmg 2.6s ease-in-out infinite}
@keyframes pmg{0%,100%{box-shadow:0 0 0 rgba(255,200,61,0)}50%{box-shadow:0 0 26px rgba(255,200,61,.45)}}
.pm-ribbon{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:999px;background:linear-gradient(90deg,#ffe27a,#ffb300);color:#3a2600;font-weight:800;font-size:11.5px;letter-spacing:.5px;white-space:nowrap}
.pm-name{font-size:19px;font-weight:800}.pm-price{font-size:34px;font-weight:800;margin:2px 0 10px}.pm-price small{font-size:14px;font-weight:600;color:#b8c6e8}
.pm-card ul{list-style:none;margin:0 0 16px;padding:0}.pm-card li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14.5px;line-height:1.35}
.pm-card li .ic{width:18px;height:18px;margin-top:1px;color:#4ade80;stroke-width:3}.pm-card.pro li .ic{color:#ffd45a}
.pm-btn{width:100%;height:50px;border-radius:16px;font-weight:800;font-size:16px}
.pm-btn.ghost{border:1.5px solid rgba(255,255,255,.5);color:#fff;background:transparent}
.pm-btn.gold{background:linear-gradient(180deg,#ffe27a,#f5a300);color:#3a2600;box-shadow:0 8px 20px rgba(245,163,0,.4)}
.pm-foot{text-align:center;color:#93a5d0;font-size:12.5px;padding:2px 10px}
</style>

const T = {
  clock: t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
  dayKey: t => { const d = new Date(t); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); },
  diffDays(t) { const d = new Date(t), n = new Date(); return Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5); },
  list(t) { if (!t) return ""; const k = T.diffDays(t); if (k <= 0) return T.clock(t); if (k === 1) return "Yesterday"; if (k < 7) return new Date(t).toLocaleDateString([], { weekday: "short" }); return new Date(t).toLocaleDateString([], { day: "numeric", month: "short" }); },
  day(t) { const k = T.diffDays(t); if (k <= 0) return "Today"; if (k === 1) return "Yesterday"; return new Date(t).toLocaleDateString([], { day: "numeric", month: "long", year: "numeric" }); },
  ago(t) { const s = (Date.now() - t) / 1000; if (s < 60) return "Just now"; const m = Math.floor(s / 60); if (m < 60) return m + " min ago"; const h = Math.floor(m / 60); if (h < 24) return h + (h > 1 ? " hours" : " hour") + " ago"; return Math.floor(h / 24) + " d ago"; },

async function compress(file, max = 1600, q = .82) {
  if (!file.type.startsWith("image/") || file.type === "image/gif") return file;
  try {
    const bmp = await createImageBitmap(file); const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", q));
  } catch { return file; }
}
async function uploadImage(file, max = 1600) {
  if (!file || !file.type.startsWith("image/")) throw new Error("Please choose a photo");
  if (file.size > 32 * 1024 * 1024) throw new Error("Photo must be under 32 MB");
  const blob = await compress(file, max); const fd = new FormData(); fd.append("image", blob, "wx.jpg");
  const r = await fetch("https://api.imgbb.com/1/upload?key=" + CFG.imgbbKey, { method: "POST", body: fd });
  const j = await r.json().catch(() => ({}));
  if (!j.success) throw new Error((j.error && j.error.message) || "Photo upload failed");
  return j.data.url;
}

/* ---------- ZAP icon (orbiting spark) ---------- */
const zapPt = (a, r = 15) => [24 + r * Math.cos(a * Math.PI / 180), 24 + r * Math.sin(a * Math.PI / 180)];
const zapStar = (cx, cy, R, r) => { let p = ""; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R; p += (i ? "L" : "M") + (cx + rr * Math.cos(a)).toFixed(2) + " " + (cy + rr * Math.sin(a)).toFixed(2); } return p + "Z"; };
const zapTail = (col, k) => { let o = ""; const n = 10, span = 125; for (let i = 0; i < n; i++) { const a1 = -span + i * span / n, a2 = -span + (i + 1) * span / n + 1.5, [x1, y1] = zapPt(a1), [x2, y2] = zapPt(a2), t = (i + 1) / n; o += `<path d="M${x1.toFixed(2)} ${y1.toFixed(2)}A15 15 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" stroke="${col}" stroke-opacity="${(t * t * k).toFixed(2)}" stroke-width="${(0.7 + t * 2.7).toFixed(2)}" fill="none" stroke-linecap="round"/>`; } return o; };
const ZAP_SVG = (cls) => `<svg class="zap ${cls}" viewBox="4 4 40 40" aria-hidden="true"><g class="z-off"><g transform="rotate(-50 24 24)">${zapTail("#9aa7bf", .5)}<path d="${zapStar(39, 24, 5.2, 2.3)}" fill="#aab6cc" fill-opacity=".6" stroke="#aab6cc" stroke-opacity=".6" stroke-width="1" stroke-linejoin="round"/></g></g><g class="z-on"><circle cx="24" cy="24" r="15" fill="none" stroke="#2d83f5" stroke-opacity=".16" stroke-width="1"/><g class="orb">${zapTail("#2d83f5", .95)}<path d="${zapStar(39, 24, 5.6, 2.5)}" fill="#3b8dff" stroke="#c9e4ff" stroke-width="1.1" stroke-linejoin="round"/></g></g></svg>`;
const zapIcon = (cls = "") => ZAP_SVG(cls);

async function sendRaw(cid, { type = "text", text = "", url = "", replyTo = null }) {
  const isG = isGroupId(cid), me = S.me; let members;

  const p = set(push(ref(S.rtdb, `chats/${cid}/messages`)), msg);
  const lt = type === "image" ? "📷 " + (text || "Photo") : text;
  const tasks = members.map(async u => {

const canNotify = () => "Notification" in window;
async function notify(title, body, cid) {

  } catch {}
}
async function askNotify() {

  const ok = Notification.permission === "granted";
  if (ok) await enablePush();
  toast(ok ? "Notifications turned on" : "Notifications blocked — enable them in browser settings");
  const b = $("#nbanner"); if (b) b.remove();
}
async function enablePush() {
  try {
    if (!canNotify() || !CFG.vapidKey || !("serviceWorker" in navigator) || !(await isSupported())) return false;
    if (Notification.permission !== "granted") return false;
    const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error("sw timeout")), 8000))]);
    const token = await getToken(getMessaging(S.app), { vapidKey: CFG.vapidKey, serviceWorkerRegistration: reg });
    if (!token) return false;
    await setDoc(doc(S.db, "users", S.me, "tokens", token), { ts: serverTimestamp(), ua: navigator.userAgent.slice(0, 120) });
    store.set("wx_fcm_" + S.me, token); S.pushOn = !!CFG.pushUrl; return true;
  } catch (e) { console.warn("push setup failed", e); return false; }
}

    const docs = r.docs.slice().sort((a, b) => ((b.data().ts && b.data().ts.toMillis ? b.data().ts.toMillis() : 0) - (a.data().ts && a.data().ts.toMillis ? a.data().ts.toMillis() : 0)));
    sheet(`<h3>Viewed by ${docs.length}${liked.size ? ` &nbsp;·&nbsp; 💫 ${liked.size}` : ""}</h3>${docs.length ? docs.map(d => { const v = d.data(); return `<div class="row" style="padding:8px 0">${avatar({ uid: d.id, ...v }, 42)}<div class="grow"><b>${esc(v.name)}</b><div class="sub">@${esc(v.username || "")}${v.ts && v.ts.toMillis ? " · " + T.ago(v.ts.toMillis()) : ""}</div></div>${liked.has(d.id) ? `<span class="vz">${zapIcon("on")}</span>` : ""}</div>`; }).join("") : `<div class="empty" style="padding:20px">No views yet</div>`}`, () => { V.paused = false; });
  },
  async sendsrep(t) { const ov = t.closest(".ov"), V = ov._V, s = ov._g.items[V.i], inp = $("#srep", ov), text = inp.value.trim(); if (!text) return; const uid = ov._g.uid; inp.value = ""; try { await sendRaw(dmId(S.me, uid), { text, replyTo: { id: s.id, name: "Status", text: s.type === "image" ? "📷 " + (s.caption || "Status") : trunc(s.text, 60) } }); toast("Reply sent"); } catch (e) { toast(fbErr(e)); } },
  editprofile(t) { const ov = t.closest(".sheet-ov"); if (ov) closeOverlay(ov); setTimeout(editProfileSheet, 30); },
  changephoto(t) { changePhoto(t.closest(".sheet-ov")); },
  async shareprofile() { const txt = `Spark me on WexaurChat: @${S.profile.username}`; try { if (navigator.share) await navigator.share({ text: txt }); else { await navigator.clipboard.writeText(txt); toast("Profile link text copied"); } } catch {} },
  myaccount() { myAccountSheet(); }, linked() { accountsSheet(true); }, switchacc() { accountsSheet(false); },
  doswitch(t) { closeAllOverlays(); setTimeout(() => switchTo(+t.dataset.n), 30); },
  addacc(t) { closeAllOverlays(); setTimeout(addAccount, 30); },
  async acclogout(t, e) { e.stopPropagation(); if (!confirm("Log out of this account?")) return; closeAllOverlays(); await logoutSlot(+t.dataset.n); },
  logout() { if (confirm("Log out of @" + S.profile.username + "?")) { closeAllOverlays(); logoutSlot(S.slot); } },
  async resetpw(t) { try { await sendPasswordResetEmail(S.auth, S.user.email); toast("Reset email sent to " + S.user.email); } catch (e) { toast(fbErr(e)); } },
  grename(t) { const gid = t.dataset.gid, g = S.groups.get(gid), n = prompt("Group name", g.name); if (n && n.trim()) update(ref(S.rtdb, "groups/" + gid), { name: n.trim().slice(0, 40) }).then(() => closeOverlay(t.closest(".ov"))).catch(e => toast(fbErr(e))); },
  async gphoto(t) { const gid = t.dataset.gid, f = await pickFile("image/*"); if (!f) return; toast("Uploading…"); try { const url = await uploadImage(f, 640); await update(ref(S.rtdb, "groups/" + gid), { photo: url }); closeOverlay(t.closest(".ov")); } catch (e) { toast(e.message || fbErr(e)); } },
  gadd(t) { const gid = t.dataset.gid, g = S.groups.get(gid); closeOverlay(t.closest(".ov")); setTimeout(() => pickerSheet({ title: "Add members", exclude: Object.keys(g.members || {}), cta: "Add to group", onDone: async (list, pel) => { for (const u of list) { await update(ref(S.rtdb, `groups/${gid}/members`), { [u.uid]: true }); await update(ref(S.rtdb, `userChats/${u.uid}/${gid}`), { t: "g", g: gid, lt: "You were added", ts: rts(), lf: S.me, u: 1 }); } closeOverlay(pel); toast("Members added"); } }), 30); },
  async gremove(t, e) { e.stopPropagation(); if (!confirm("Remove this member?")) return; try { await groupRemoveMember(t.dataset.gid, t.dataset.uid); closeOverlay(t.closest(".ov")); } catch (er) { toast(fbErr(er)); } },
  async gleave(t) { if (!confirm("Leave this group?")) return; const gid = t.dataset.gid; try { await remove(ref(S.rtdb, `userChats/${S.me}/${gid}`)); const gg = S.groups.get(gid); if (gg && gg.admins && gg.admins[S.me]) await remove(ref(S.rtdb, `groups/${gid}/admins/${S.me}`)); await remove(ref(S.rtdb, `groups/${gid}/members/${S.me}`)); closeAllOverlays(); toast("You left the group"); } catch (e) { toast(fbErr(e)); } }
};
document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t, e); });

/* ---------- go ---------- */
const savedSlot = store.get("wx_slot", 0);
boot(accounts[savedSlot] || Object.keys(accounts).length === 0 ? savedSlot : +Object.keys(accounts)[0]);
</script>
